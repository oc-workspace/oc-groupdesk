# Optional TLS reverse proxy on the installing owner's host.
# Configure your own certificate and hostname; no existing shared Docker network is required.
server {
  listen 443 ssl;
  server_name your-domain.example;
  ssl_certificate /your/certificate.pem;
  ssl_certificate_key /your/private-key.pem;
  location / {
    proxy_pass http://127.0.0.1:3110;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 110m;
  }
}
