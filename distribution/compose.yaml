services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.13-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${BOOTSTRAP_USER:?Required}
      POSTGRES_PASSWORD: ${BOOTSTRAP_PASSWORD:?Required}
      POSTGRES_DB: postgres
    volumes: ["${INSTANCE_ROOT:?Required}/data/postgres:/var/lib/postgresql/data"]
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 60
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  app: &app
    image: ${APP_IMAGE:?Required}
    restart: unless-stopped
    init: true
    env_file: ["${INSTANCE_ROOT}/config/app.env"]
    environment: {PORT: '3110', DATA_DIR: /data}
    volumes: ["${INSTANCE_ROOT}/data/files:/data"]
    networks: [database, application]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    depends_on: {postgres: {condition: service_healthy}}
    ports: ["127.0.0.1:${APP_PORT:-3110}:3110"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3110/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: {driver: json-file, options: {max-size: 10m, max-file: '3'}}
  worker:
    <<: *app
    profiles: [workers]
    ports: []
    command: [npm, run, worker]
    healthcheck: {disable: true}
    stop_grace_period: 660s
  interaction-worker:
    <<: *app
    profiles: [workers]
    ports: []
    command: [npm, run, interactions:worker]
    healthcheck: {disable: true}
    stop_grace_period: 135s
networks:
  database: {internal: true}
  application:
    internal: ${ISOLATED:-false}
