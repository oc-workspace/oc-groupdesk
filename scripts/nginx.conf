server {
    listen 80;
    server_name groupdesk.rococo.dev;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name groupdesk.rococo.dev;
    ssl_certificate /etc/letsencrypt/rococo.dev/fullchain.cer;
    ssl_certificate_key /etc/letsencrypt/rococo.dev/rococo.dev.key;
    client_max_body_size 101m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    location / {
        set $groupdesk_upstream groupdesk-web:3110;
        proxy_pass http://$groupdesk_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_redirect off;
    }
}
