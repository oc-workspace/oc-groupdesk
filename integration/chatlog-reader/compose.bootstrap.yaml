name: chatlog-reader
services:
  bootstrap-artifacts:
    image: ${CHATLOG_BOOTSTRAP_IMAGE:?Set the verified one-shot image}
    pull_policy: never
    container_name: chatlog-reader-bootstrap-artifacts
    profiles: [bootstrap]
    restart: "no"
    read_only: true
    network_mode: none
    entrypoint: [/usr/bin/true]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    pids_limit: 8
    ulimits:
      core: 0
